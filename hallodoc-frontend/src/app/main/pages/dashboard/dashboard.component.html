<mat-card>
  <h2>Dashboard</h2>
  <button mat-raised-button color="primary" (click)="pingApi()">Get Ping Message</button>
  <app-sample-button label="Sample Shared Button"></app-sample-button>
  @if (pingMessage) {
    <div id="ping-result">Ping Message: {{ pingMessage }}</div>
  }
  <button mat-stroked-button color="accent" (click)="loadAllPings()">Load All Pings</button>
  @if (dataSource.length) {
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        @for (element of dataSource; track element.id) {
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        }
      </ng-container>
      <ng-container matColumnDef="message">
        <th mat-header-cell *matHeaderCellDef> Message </th>
        @for (element of dataSource; track element.id) {
          <td mat-cell *matCellDef="let element"> {{element.message}} </td>
        }
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</mat-card>
