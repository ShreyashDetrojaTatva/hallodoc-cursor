<div class="login-container">
  <div class="illustration">
    <img src="assets/media/auth/login-banner.png" alt="Doctor Illustration">
  </div>

  <div class="content">
    <div class="header">
      <button mat-icon-button color="primary" routerLink="/" class="back-button">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <img src="assets/media/common/hallodoc-logo.svg" alt="HalloDoc" class="logo">
      <h1>Welcome Back</h1>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="error-message mat-elevation-z1">
      <mat-icon color="warn">error</mat-icon>
      <span>{{error}}</span>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-container" *ngIf="isLoading">
      <mat-spinner diameter="50"></mat-spinner>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form" *ngIf="!isLoading">
      <mat-card>
        <mat-card-content>
          <mat-form-field appearance="outline">
            <mat-label>Username or Email</mat-label>
            <input matInput formControlName="usernameOrEmail" required>
            <mat-error *ngIf="form.get('usernameOrEmail')?.hasError('required')">
              Username or email is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" required>
            <mat-error *ngIf="form.get('password')?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading">
            Log In
          </button>

          <div class="links">
            <a routerLink="/forgot-password">Forgot Password?</a>
          </div>
        </mat-card-content>
      </mat-card>
    </form>
  </div>
</div>
