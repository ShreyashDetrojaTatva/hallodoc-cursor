<div class="login-root">
  <button mat-stroked-button color="primary" class="back-btn" (click)="router.navigate(['/login'])" style="position: absolute; top: 2rem; left: 2rem; z-index: 10;">
    <mat-icon>arrow_back</mat-icon> Back
  </button>
  <div class="login-illustration">
    <img src="./assets/media/auth/login-banner.png" alt="Doctor Illustration" />
  </div>
  <div class="login-content">
    <div class="login-header">
      <img src="./assets/media/common/hallodoc-logo.svg" alt="HalloDoc" class="logo" />
      <h2>Forgot Password</h2>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>mail</mat-icon>
        <input matInput formControlName="email" type="email" required />
        <mat-error *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Please enter a valid email address.
        </mat-error>
      </mat-form-field>
      <button mat-raised-button color="primary" class="login-btn" type="submit" [disabled]="loading || form.invalid">
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>
    <div class="message" *ngIf="message">{{ message }}</div>
  </div>
</div>
