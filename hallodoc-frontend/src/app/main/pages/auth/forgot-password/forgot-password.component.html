<div class="forgot-password-container">
  <div class="illustration">
    <img src="assets/media/auth/login-banner.png" alt="Doctor Illustration">
  </div>

  <div class="content">
    <div class="header">
      <button mat-icon-button color="primary" routerLink="/" class="back-button">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <img src="assets/media/common/hallodoc-logo.svg" alt="HalloDoc" class="logo">
      <h1>Forgot Password</h1>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="error-message mat-elevation-z1">
      <mat-icon color="warn">error</mat-icon>
      <span>{{error}}</span>
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="success-message mat-elevation-z1">
      <mat-icon color="primary">check_circle</mat-icon>
      <span>{{successMessage}}</span>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-container" *ngIf="isLoading">
      <mat-spinner diameter="50"></mat-spinner>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="forgot-password-form" *ngIf="!isLoading">
      <mat-card>
        <mat-card-content>
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email" required>
            <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="form.get('email')?.hasError('email')">Please enter a valid email</mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading">
            Send Reset Link
          </button>

          <div class="back-to-login">
            <button mat-stroked-button type="button" routerLink="/login">
              Back to Login
            </button>
          </div>
        </mat-card-content>
      </mat-card>
    </form>
  </div>
</div>
