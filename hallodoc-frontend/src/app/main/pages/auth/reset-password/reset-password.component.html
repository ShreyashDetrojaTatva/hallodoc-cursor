<div class="login-root">
  <button mat-stroked-button color="primary" class="back-btn" (click)="router.navigate(['/login'])" style="position: absolute; top: 2rem; left: 2rem; z-index: 10;">
    <mat-icon>arrow_back</mat-icon> Back
  </button>
  <div class="login-illustration">
    <img src="./assets/media/auth/login-banner.png" alt="Doctor Illustration" />
  </div>
  <div class="login-content">
    <div class="login-header">
      <img src="./assets/media/common/hallodoc-logo.svg" alt="HalloDoc" class="logo" />
      <h2>Reset Password</h2>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>New Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput formControlName="password" type="password" required />
        <mat-error *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Password must be at least 6 characters.
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput formControlName="confirmPassword" type="password" required />
        <mat-error *ngIf="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched">
          Please confirm your password.
        </mat-error>
      </mat-form-field>
      <div *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched" class="error-message">
        Passwords do not match
      </div>
      <button mat-raised-button color="primary" class="login-btn" type="submit" [disabled]="loading || form.invalid || !token">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>
    <div class="message" *ngIf="message">{{ message }}</div>
  </div>
</div>
