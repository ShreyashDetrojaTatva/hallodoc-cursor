<div class="reset-password-container">
  <div class="illustration">
    <img src="assets/media/auth/login-banner.png" alt="Doctor Illustration">
  </div>

  <div class="content">
    <div class="header">
      <img src="assets/media/common/hallodoc-logo.svg" alt="HalloDoc" class="logo">
      <h1>Reset Password</h1>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="error-message mat-elevation-z1">
      <mat-icon color="warn">error</mat-icon>
      <span>{{error}}</span>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-container" *ngIf="isLoading">
      <mat-spinner diameter="50"></mat-spinner>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-password-form" *ngIf="!isLoading">
      <mat-card>
        <mat-card-content>
          <mat-form-field appearance="outline">
            <mat-label>New Password</mat-label>
            <input matInput formControlName="password" type="password" required>
            <mat-error>{{getErrorMessage('password')}}</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Confirm Password</mat-label>
            <input matInput formControlName="confirmPassword" type="password" required>
            <mat-error>{{getErrorMessage('confirmPassword')}}</mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading || !token">
            Reset Password
          </button>
        </mat-card-content>
      </mat-card>
    </form>
  </div>
</div>
