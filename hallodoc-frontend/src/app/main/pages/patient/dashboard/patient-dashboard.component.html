<div class="dashboard-container">
  <div class="header">
    <h1>My Requests</h1>
    <button mat-icon-button color="primary" (click)="refresh()">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  <!-- Error Message -->
  <div *ngIf="error" class="error-message mat-elevation-z1">
    <mat-icon color="warn">error</mat-icon>
    <span>{{error}}</span>
    <button mat-button color="primary" (click)="loadRequests()">Try Again</button>
  </div>

  <!-- Loading Spinner -->
  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner diameter="50"></mat-spinner>
  </div>

  <!-- Request Table -->
  <div class="table-container" *ngIf="!isLoading">
    <mat-form-field>
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search requests..." #input>
    </mat-form-field>

    <table mat-table [dataSource]="dataSource" matSort>
      <!-- Request ID Column -->
      <ng-container matColumnDef="requestId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Request ID</th>
        <td mat-cell *matCellDef="let row">{{row.requestId}}</td>
      </ng-container>

      <!-- Request Type Column -->
      <ng-container matColumnDef="requestType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
        <td mat-cell *matCellDef="let row">{{row.requestType}}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let row">
          <span class="status-chip" [style.background-color]="getStatusColor(row.status)">
            {{row.status}}
          </span>
        </td>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
        <td mat-cell *matCellDef="let row">{{row.createdAt | date}}</td>
      </ng-container>

      <!-- First Name Column -->
      <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
        <td mat-cell *matCellDef="let row">{{row.firstName}}</td>
      </ng-container>

      <!-- Last Name Column -->
      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
        <td mat-cell *matCellDef="let row">{{row.lastName}}</td>
      </ng-container>

      <!-- Symptoms Column -->
      <ng-container matColumnDef="symptoms">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Symptoms</th>
        <td mat-cell *matCellDef="let row">{{row.symptoms}}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="viewDocuments(row.requestId)">
            <mat-icon>folder</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="8">No data matching the filter "{{input.value}}"</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of requests"></mat-paginator>
  </div>
</div>
