<app-header></app-header>

<div class="container">
  <mat-card class="form-card">
    <div class="form-content">
      @switch (type) {
        @case ('patient') {
          <app-patient-request-form></app-patient-request-form>
        }
        @case ('family') {
          <app-family-request-form></app-family-request-form>
        }
        @case ('concierge') {
          <app-concierge-request-form></app-concierge-request-form>
        }
        @case ('business') {
          <app-business-request-form></app-business-request-form>
        }
        @default {
          <div class="error-message">
            <h2>Invalid Request Type</h2>
            <p>The request type "{{ type }}" is not valid.</p>
          </div>
        }
      }
    </div>
  </mat-card>
</div>

<app-footer></app-footer>
